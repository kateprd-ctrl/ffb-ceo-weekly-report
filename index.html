*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px;background:radial-gradient(1200px 500px at 50% -10%,#e4f2ea 0,#f6f5f2 60%);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#1c1c1c}
.card{width:min(380px,100%);background:#fff;border:1px solid #e4e2dc;border-top:5px solid #1f8a4c;border-radius:20px;padding:28px 26px 24px;box-shadow:0 10px 40px rgba(20,40,30,.08);display:flex;flex-direction:column;align-items:flex-start;gap:6px}

.good li{font-size:14px;line-height:1.35;padding-left:24px;position:relative}
.good li::before{content:"\2713";position:absolute;left:0;top:0;color:#1f8a4c;font-weight:800}
form{width:100%;display:flex;flex-direction:column;gap:10px}
label{font-size:12px;color:#6b6b6b}
input,button{font:inherit;width:100%;padding:13px 14px;border-radius:12px;border:1px solid #d9d6cd}
input{background:#fbfaf8;font-size:16px}
input:focus{outline:2px solid #1f8a4c;outline-offset:1px;background:#fff}
button{background:#1f8a4c;color:#fff;border-color:#1f8a4c;font-weight:700;cursor:pointer;margin-top:2px}
button:hover{filter:brightness(1.07)}
#e{color:#c0392b;font-size:13px;min-height:16px}
.f{font-size:12px;color:#8a8a8a}
</style></head>
