*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px;background:radial-gradient(1200px 500px at 50% -10%,#e4f2ea 0,#f6f5f2 60%);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#1c1c1c}

form{width:100%;display:flex;flex-direction:column;gap:10px}
label{font-size:12px;color:#6b6b6b}
input,button{font:inherit;width:100%;padding:13px 14px;border-radius:12px;border:1px solid #d9d6cd}
input{background:#fbfaf8;font-size:16px}

button:hover{filter:brightness(1.07)}

.f{font-size:12px;color:#8a8a8a}
</style></head>
